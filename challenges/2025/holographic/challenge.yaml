id: 2025-holographic
name: Holographic
year: 2025
event: DEF CON CTF Qualifier
category: pwn
difficulty: hard
points: 300
tags: [rng, prng-prediction, shuffle, cpp]
authors: ["Nautilus Institute"]

description: |
  Connect to the remote service. It is a harder sibling of a card-shuffle RNG
  challenge: the service seeds a random number generator, shuffles a deck, and
  asks you to predict the exact shuffled sequence it produces.

  Recover the RNG and shuffle, reproduce the sequence the service expects, and
  send it back. A correct sequence makes the service print the flag (read from
  `/flag`).

flag:
  format: 'flag\{[^}]*\}'
  value_file: flag.txt

delivery:
  type: service
  service:
    compose: docker-compose.yml
    service: challenge
    port: 31337

build:
  type: docker
  dockerfile: Dockerfile

source:
  upstream: https://github.com/Nautilus-Institute/quals-2025
  path: holographic
  license: MIT

# Public write-up index for the 2025 quals; cross-check the intended solution
# path (predict the RNG/shuffle sequence) and the flag-file location
# (FLAG_FILE default /flag) wired into the image.
references:
  - https://ctftime.org/event/2670/tasks/

# Public write-up index for the 2025 quals (DEF CON 33); cross-check the
# intended solution path and the flag-file location wired into the image.
references:
  - https://ctftime.org/event/2604/tasks/
