id: 2024-npc-ua
name: NPC-UA
year: 2024
event: DEF CON CTF Qualifier
category: pwn
difficulty: hard
points: 350
tags: [dotnet, fsharp, deserialization, rce, protocol]
authors: ["Nautilus Institute"]

description: |
  Connect to the remote service. It is a server for "NPC-UA", a custom binary
  protocol (loosely modeled on OPC-UA) implemented in F# on .NET. The server
  reads protocol messages from the connection and reconstructs objects from
  them.

  The deserialization of attacker-supplied data is not safe. Reverse the
  protocol, build messages that abuse it to gain code execution or arbitrary
  file read on the server, and recover the flag from the file `/flag.txt`.

flag:
  format: 'flag\{[^}]*\}'
  value_file: flag.txt

delivery:
  type: service
  service:
    compose: docker-compose.yml
    service: challenge
    port: 31337

build:
  type: docker
  dockerfile: Dockerfile

source:
  upstream: https://github.com/Nautilus-Institute/quals-2024
  path: npc-ua
  license: MIT

# Public write-up index for the 2024 quals; cross-check the intended solution
# path and the flag-file location wired into the image.
references:
  - https://ctftime.org/event/2229/tasks/
