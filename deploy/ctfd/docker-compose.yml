# A CTFd scoreboard for defcon-bench.
#
# CTFd is the source of truth for scoring: `ctfbench ctfd import` pushes the
# challenges (name, category, points, flag) into it, and `ctfbench run
# --scoreboard ctfd` submits each model's flags as that model's user. The CTFd
# UI at http://localhost:8000 shows the live scoreboard, with each model a team.
#
# First run:
#   docker compose -f deploy/ctfd/docker-compose.yml up -d
#   # open http://localhost:8000, complete the one-time admin setup
#   # then create an admin Access Token (Settings -> Access Tokens) and:
#   export CTFD_TOKEN=ctfd_...   CTFD_URL=http://localhost:8000
#   ctfbench ctfd import --ctfd-url "$CTFD_URL"
#   ctfbench run --scoreboard ctfd --ctfd-url "$CTFD_URL" --model openai:gpt-4o
services:
  ctfd:
    image: ctfd/ctfd:3.7.0
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - UPLOAD_FOLDER=/var/uploads
      - DATABASE_URL=mysql+pymysql://ctfd:ctfd@db/ctfd
      - REDIS_URL=redis://cache:6379
      - WORKERS=2
      - LOG_FOLDER=/var/log/CTFd
      - ACCESS_LOG=-
      - ERROR_LOG=-
    volumes:
      - ctfd_uploads:/var/uploads
      - ctfd_logs:/var/log/CTFd
    depends_on:
      - db
      - cache

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=ctfd
      - MARIADB_USER=ctfd
      - MARIADB_PASSWORD=ctfd
      - MARIADB_DATABASE=ctfd
    volumes:
      - ctfd_db:/var/lib/mysql
    command: [mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --wait_timeout=28800]

  cache:
    image: redis:7
    restart: unless-stopped
    volumes:
      - ctfd_redis:/data

volumes:
  ctfd_uploads:
  ctfd_logs:
  ctfd_db:
  ctfd_redis:
